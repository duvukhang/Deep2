<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ Thống Giám Sát Tài Xế - SOTA</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background: #121212; color: white; }
        .video-container { border: 5px solid #333; border-radius: 10px; overflow: hidden; }
        .alert-box { height: 100px; font-size: 24px; font-weight: bold; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4">HỆ THỐNG GIÁM SÁT & CẢNH BÁO NGỦ GẬT</h2>
        
        <div class="row">
            <div class="col-md-8">
                <div class="video-container">
                    <!-- FIX CHÍNH Ở ĐÂY -->
                    <img src="{{ url_for('video') }}" width="100%">
                </div>
            </div>
            
            <div class="col-md-4">
                <div id="status" class="alert-box alert alert-success text-center">TỈNH TÁO</div>
                
                <div class="card bg-dark text-white mt-3">
                    <div class="card-body">
                        <h5>Chỉ số thời gian thực</h5>
                        <p>EAR: <span id="ear_val" class="fw-bold text-warning">0.00</span></p>
                        <p>Tư thế: <span id="pose_val" class="fw-bold text-info">0</span></p>
                        <p>Vật cản: <span id="occlusion" class="fw-bold text-light">Không</span></p>
                    </div>
                </div>
                
                <div id="map-info" class="mt-3 p-3 border border-primary rounded bg-dark text-white">
                    <h6>Trạm nghỉ gần nhất (OSM):</h6>
                    <ul id="rest_stops" class="small text-warning">
                        <li>Chưa có dữ liệu</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>
</html>
